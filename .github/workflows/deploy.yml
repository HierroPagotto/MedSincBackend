name: Deploy MedSinc Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            echo "=== Iniciando deploy MedSinc ==="

            cd /opt/medsinc-backend

            echo "=== Verificando .env ==="

            if [ ! -f .env ]; then
              echo "ERRO: .env não existe na AWS."
              exit 1
            fi

            echo "=== Atualizando código ==="

            git fetch origin main
            git reset --hard origin/main

            echo "=== Verificando .env após atualização ==="

            if [ ! -f .env ]; then
              echo "ERRO: .env desapareceu durante o deploy."
              exit 1
            fi

            echo "=== Ativando ambiente virtual ==="

            source venv/bin/activate

            echo "=== Instalando dependências ==="

            pip install -r requirements.txt

            echo "=== Reiniciando MedSinc ==="

            sudo systemctl daemon-reload
            sudo systemctl restart medsinc

            echo "=== Aguardando inicialização ==="

            sleep 5

            echo "=== Verificando serviço ==="

            if ! sudo systemctl is-active --quiet medsinc; then
              echo "ERRO: MedSinc não iniciou corretamente."

              sudo systemctl status medsinc --no-pager -l || true

              echo "=== Últimos logs do MedSinc ==="

              sudo journalctl -u medsinc -n 50 --no-pager || true

              exit 1
            fi

            echo "=== Deploy concluído com sucesso! ==="
            sudo systemctl status medsinc --no-pager